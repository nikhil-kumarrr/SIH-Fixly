# Keep heap modest — 8G × multiple daemons was freezing the Mac.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# mapbox_maps_flutter 2.29.1 assumes AGP 9 → built-in Kotlin (skips kotlin-android).
# Flutter default false leaves no kotlin{} extension → build fails.
android.builtInKotlin=false

# Controlled workers and parallel settings to prevent Docker OOM
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx1024m

org.gradle.vfs.watch=false
