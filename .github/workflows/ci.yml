name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Syntax check server entrypoint
        working-directory: backend
        run: node --check server.js

  admin-build:
    name: Admin Panel Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'FIXLY ADMIN PANEL/package.json'

      - name: Install dependencies
        working-directory: 'FIXLY ADMIN PANEL'
        run: npm ci || npm install

      - name: Build Admin Panel
        working-directory: 'FIXLY ADMIN PANEL'
        run: npm run build

  ai-ml-check:
    name: AI / ML Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: python -m compileall ai_ml/
